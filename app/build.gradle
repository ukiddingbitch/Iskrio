plugins { id 'com.android.application' }

// Secrets are supplied locally; no signing key/password is committed.
def releaseCredentials = [
    storeFile: providers.environmentVariable('ISKRIO_KEYSTORE_FILE').orNull,
    storePassword: providers.environmentVariable('ISKRIO_STORE_PASSWORD').orNull,
    keyAlias: providers.environmentVariable('ISKRIO_KEY_ALIAS').orNull,
    keyPassword: providers.environmentVariable('ISKRIO_KEY_PASSWORD').orNull
]
def hasReleaseCredentials = releaseCredentials.values().every { it != null && !it.isBlank() }
def hasStudioSigning = providers.gradleProperty('android.injected.signing.store.file').isPresent()

android {
    namespace 'sk.iskrio.studio'
    compileSdk 37
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'sk.iskrio.studio'
        testInstrumentationRunner 'sk.iskrio.studio.OfflineMediaTest'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.7.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (hasReleaseCredentials) {
            release {
                storeFile file(releaseCredentials.storeFile)
                storePassword releaseCredentials.storePassword
                keyAlias releaseCredentials.keyAlias
                keyPassword releaseCredentials.keyPassword
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            debuggable false
            jniDebuggable false
            // Keep optimizer behavior unchanged for this packaging-only release.
            minifyEnabled false
            if (hasReleaseCredentials) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.9"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"
    // Select the Android API artifact explicitly so IDE imports see okhttp3 classes.
    implementation "com.squareup.okhttp3:okhttp-android:5.5.1"
    implementation "pl.droidsonroids.gif:android-gif-drawable:1.2.32"
    implementation "androidx.media3:media3-inspector:1.11.1"
    implementation "androidx.media3:media3-transformer:1.11.1"
    implementation "androidx.media3:media3-effect:1.11.1"
    implementation "org.jsoup:jsoup:1.24.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20260814"
}

// Android Studio's Generate Signed APK flow supplies its own injected signing values.
tasks.configureEach { task ->
    if (task.name in ['packageRelease', 'bundleRelease']) {
        task.doFirst {
            if (!hasReleaseCredentials && !hasStudioSigning) {
                throw new GradleException('Release signing is not configured. See docs/RELEASE.md or use Android Studio Generate Signed APK.')
            }
        }
    }
}
